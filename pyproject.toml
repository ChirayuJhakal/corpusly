[project]
name = "corpusly"
version = "0.1.0"
description = "A multi-tenant document intelligence platform"
readme = "README.md"
authors = [
    { name = "Chirayu Jhakal" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "pydantic>=2.13.5",
    "uvicorn>=0.52.4",
]

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"
